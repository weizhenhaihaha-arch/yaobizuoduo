name: G0 exact-head CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-ci:
    name: Full CI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact subject and run identity
        env:
          CI_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: python scripts/verify_exact_head_ci.py

      - name: Install exact Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-dev.txt

      - name: Install exact Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Python dependencies from official PyPI
        run: python -m pip install --index-url https://pypi.org/simple --requirement requirements-dev.txt

      - name: Install integrity-locked frontend dependencies
        run: npm --prefix frontend ci --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Validate canonical project status
        run: python scripts/validate_project_status.py PROJECT_STATUS.yaml --repo-root .

      - name: Run complete fail-closed offline verification
        run: python scripts/verify_full_ci.py --offline --fail-closed --require-transport

  exact-head:
    name: G0 / exact-head
    if: ${{ always() }}
    needs:
      - full-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Preserve the stable required-check context
        env:
          FULL_CI_RESULT: ${{ needs.full-ci.result }}
        run: test "$FULL_CI_RESULT" = "success"
