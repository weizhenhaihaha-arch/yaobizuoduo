name: G0 exact-head CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-ci:
    name: Full CI / ${{ matrix.os }} / shard-${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
        shard:
          - 0
          - 1
          - 2
          - 3
    steps:
      - name: Checkout exact event subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-dev.txt

      - name: Verify exact subject and run identity
        env:
          CI_EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: python scripts/verify_exact_head_ci.py

      - name: Install exact Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Python dependencies from official PyPI
        run: >-
          python -m pip install
          --index-url https://pypi.org/simple
          --require-hashes
          --only-binary=:all:
          --requirement requirements-dev.txt

      - name: Install integrity-locked frontend dependencies
        run: npm --prefix frontend ci --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Run complete verification under reversible Linux egress isolation
        if: runner.os == 'Linux'
        timeout-minutes: 15
        shell: bash
        env:
          G1_CI_WORKERS: "4"
          G1_CI_SHARD_COUNT: "4"
          G1_CI_SHARD_INDEX: ${{ matrix.shard }}
          G1_OS_EGRESS_ISOLATED: "1"
        run: |
          set -euo pipefail
          cleanup() {
            sudo iptables -D OUTPUT -j G1T01_OUT 2>/dev/null || true
            sudo iptables -F G1T01_OUT 2>/dev/null || true
            sudo iptables -X G1T01_OUT 2>/dev/null || true
            sudo ip6tables -D OUTPUT -j G1T01_OUT 2>/dev/null || true
            sudo ip6tables -F G1T01_OUT 2>/dev/null || true
            sudo ip6tables -X G1T01_OUT 2>/dev/null || true
          }
          trap cleanup EXIT
          cleanup
          for tool in iptables ip6tables; do
            sudo "$tool" -N G1T01_OUT
            sudo "$tool" -A G1T01_OUT -o lo -j RETURN
            sudo "$tool" -A G1T01_OUT -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
            sudo "$tool" -A G1T01_OUT -j REJECT
            sudo "$tool" -I OUTPUT 1 -j G1T01_OUT
            sudo "$tool" -C OUTPUT -j G1T01_OUT
          done
          python - <<'PY'
          import socket
          sock = socket.socket()
          sock.settimeout(3)
          try:
              sock.connect(("1.1.1.1", 443))
          except OSError:
              pass
          else:
              raise SystemExit("Python egress probe unexpectedly connected")
          finally:
              sock.close()
          PY
          node -e 'const net=require("net"); const s=net.connect({host:"1.1.1.1",port:443}); s.setTimeout(3000); s.on("connect",()=>process.exit(1)); s.on("error",()=>process.exit(0)); s.on("timeout",()=>process.exit(0));'
          if curl --noproxy '*' --silent --show-error --connect-timeout 3 http://1.1.1.1/ >/dev/null 2>&1; then
            echo "curl child-process egress probe unexpectedly connected" >&2
            exit 1
          fi
          python scripts/verify_full_ci.py --offline --fail-closed --require-transport

      - name: Restore Linux egress policy
        if: ${{ always() && runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo iptables -D OUTPUT -j G1T01_OUT 2>/dev/null || true
          sudo iptables -F G1T01_OUT 2>/dev/null || true
          sudo iptables -X G1T01_OUT 2>/dev/null || true
          sudo ip6tables -D OUTPUT -j G1T01_OUT 2>/dev/null || true
          sudo ip6tables -F G1T01_OUT 2>/dev/null || true
          sudo ip6tables -X G1T01_OUT 2>/dev/null || true

      - name: Run complete verification under reversible Windows egress isolation
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        env:
          G1_CI_WORKERS: "4"
          G1_CI_SHARD_COUNT: "4"
          G1_CI_SHARD_INDEX: ${{ matrix.shard }}
          G1_OS_EGRESS_ISOLATED: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $snapshot = Join-Path $env:RUNNER_TEMP "g1-t01-firewall.wfw"
          netsh advfirewall export $snapshot | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "firewall export failed" }
          try {
            Get-Process Runner.Worker,Runner.Listener -ErrorAction SilentlyContinue |
              Where-Object { $_.Path } |
              ForEach-Object {
                New-NetFirewallRule -DisplayName "G1T01-$($_.ProcessName)" `
                  -Direction Outbound -Action Allow -Program $_.Path -Profile Any | Out-Null
              }
            Set-NetFirewallProfile -Profile Domain,Public,Private `
              -Enabled True -DefaultOutboundAction Block
            $profiles = Get-NetFirewallProfile
            if ($profiles.Enabled -contains $false -or
                $profiles.DefaultOutboundAction -contains "Allow") {
              throw "Windows outbound isolation was not applied"
            }
            @'
          import socket
          sock = socket.socket()
          sock.settimeout(3)
          try:
              sock.connect(("1.1.1.1", 443))
          except OSError:
              pass
          else:
              raise SystemExit("Python egress probe unexpectedly connected")
          finally:
              sock.close()
          '@ | python -
            node -e 'const net=require("net"); const s=net.connect({host:"1.1.1.1",port:443}); s.setTimeout(3000); s.on("connect",()=>process.exit(1)); s.on("error",()=>process.exit(0)); s.on("timeout",()=>process.exit(0));'
            curl.exe --noproxy "*" --silent --show-error --connect-timeout 3 http://1.1.1.1/ *> $null
            if ($LASTEXITCODE -eq 0) {
              throw "curl child-process egress probe unexpectedly connected"
            }
            python scripts/verify_full_ci.py --offline --fail-closed --require-transport
          }
          finally {
            if (Test-Path $snapshot) {
              netsh advfirewall import $snapshot | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "firewall restore failed" }
            }
          }

      - name: Restore Windows egress policy
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $snapshot = Join-Path $env:RUNNER_TEMP "g1-t01-firewall.wfw"
          if (Test-Path $snapshot) {
            netsh advfirewall import $snapshot | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "firewall restore failed" }
          }

  exact-head:
    name: G0 / exact-head
    if: ${{ always() }}
    needs:
      - full-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Preserve the stable required-check context
        env:
          FULL_CI_RESULT: ${{ needs.full-ci.result }}
        run: test "$FULL_CI_RESULT" = "success"
